name: Update

on:
  schedule:
    # UTC 00:00 = 北京时间早上 08:00
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  BRANCH: main

jobs:
  Update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get current Beijing time
        run: |
          echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

      # 读取仓库变量开关
      - name: Check update switch
        id: check_switch
        run: |
          if [[ "${{ vars.IPTV_UPDATE_ENABLED }}" == "true" ]]; then
            echo "ENABLED=true" >> "$GITHUB_ENV"
            echo "✅ 开关开启，将执行 IPTV 更新"
          else
            echo "ENABLED=false" >> "$GITHUB_ENV"
            echo "❌ 开关关闭，跳过全部更新流程"
          fi

      - name: Set up Python
        if: env.ENABLED == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: env.ENABLED == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run iptv generate script
        if: env.ENABLED == 'true'
        run: |
          python 抓取.py

      - name: Check generated files
        if: env.ENABLED == 'true'
        run: |
          if [ ! -f iptv.txt ] || [ ! -f iptv.m3u ]; then
            echo "错误：未生成 iptv.txt 或 iptv.m3u"
            exit 1
          fi
          ls -lh iptv.txt iptv.m3u
          TXT_LINES=$(wc -l < iptv.txt)
          M3U_LINES=$(wc -l < iptv.m3u)
          echo "iptv.txt lines: $TXT_LINES"
          echo "iptv.m3u lines: $M3U_LINES"

      - name: Skip commit if output empty
        if: env.ENABLED == 'true'
        run: |
          TXT_LINES=$(wc -l < iptv.txt)
          M3U_LINES=$(wc -l < iptv.m3u)
          if [ "$TXT_LINES" -eq 0 ] || [ "$M3U_LINES" -eq 0 ]; then
            echo "生成的播放列表为空，终止工作流，不提交"
            exit 1
          fi

      - name: Generate README.md
        if: env.ENABLED == 'true'
        run: |
          echo "## IPTV源自动更新" > README.md
          echo "更新时间：${DATE}" >> README.md
          echo "" >> README.md
          echo "- iptv.txt：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/iptv.txt" >> README.md
          echo "- iptv.m3u：https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${BRANCH}/iptv.m3u" >> README.md

      - name: Configure Git bot identity
        if: env.ENABLED == 'true'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push files
        if: env.ENABLED == 'true'
        run: |
          git add iptv.txt iptv.m3u README.md
          if git diff --cached --quiet; then
            echo "没有文件变化，跳过提交"
            exit 0
          fi
          git commit -m "Update on ${DATE}"
          git push origin "${BRANCH}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: |
            iptv.txt
            iptv.m3u
          if-no-files-found: warn
