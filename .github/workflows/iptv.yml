name: IPTV 自动整理

on:
  schedule:
    # UTC 20:00 = 北京时间次日 04:00
    - cron: "0 20 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  iptv:
    name: 抓取并检测 IPTV
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # 检出仓库
      # ------------------------------------------------------

      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------
      # 设置 Python
      # ------------------------------------------------------

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ------------------------------------------------------
      # 安装依赖
      # ------------------------------------------------------

      - name: 安装 Python 依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # ------------------------------------------------------
      # 创建输出目录
      # ------------------------------------------------------

      - name: 创建输出目录
        run: |
          mkdir -p output

      # ------------------------------------------------------
      # 执行 IPTV 整理
      # ------------------------------------------------------

      - name: 抓取、清洗、检测 IPTV
        run: |
          python .github/scripts/iptv.py

      # ------------------------------------------------------
      # 查看结果
      # ------------------------------------------------------

      - name: 查看生成结果
        run: |
          echo "================================"
          echo "生成文件"
          echo "================================"

          find output -maxdepth 1 -type f -print

          echo ""
          echo "================================"
          echo "文件大小"
          echo "================================"

          ls -lh output/

          echo ""
          echo "================================"
          echo "频道数量"
          echo "================================"

          if [ -f output/iptv.txt ]; then
            echo "iptv.txt：$(wc -l < output/iptv.txt) 条"
          fi

          if [ -f output/iptv.m3u ]; then
            echo "iptv.m3u：$(grep -c '^#EXTINF' output/iptv.m3u || true) 条"
          fi

      # ------------------------------------------------------
      # 提交 GitHub
      # ------------------------------------------------------

      - name: 提交更新
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/iptv.txt
          git add output/iptv.m3u

          if git diff --cached --quiet; then
            echo "没有新的变化，不提交"
          else
            git commit -m "自动更新 IPTV 源"
            git push
          fi
