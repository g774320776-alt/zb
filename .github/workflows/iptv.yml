name: Update

# 触发规则
on:
  schedule:
    - cron: 0 21 * * *   # UTC时间21点 → 北京时间05:00执行
  workflow_dispatch:     # 支持网页手动点击运行

permissions:
  contents: write        # 授予仓库读写权限，允许git push提交

env:
  TZ: Asia/Shanghai      # 环境时区设为上海

jobs:
  Update:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # 任务最大超时20分钟

    steps:
      # 1.拉取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2.获取北京时间存入环境变量 DATE
      - name: Get current Beijing time
        run: echo "DATE=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      # 3.安装Python3环境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # 4.安装python依赖 pandas requests
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # 5.运行iptv生成脚本，输出iptv.txt、iptv.m3u、各分类txt
      - name: Run iptv generate script
        run: python get_iptv.py

      # 6.覆盖生成README.md，仅写入更新时间
      - name: Generate README.md
        run: |
          echo "## 更新于 $DATE" > README.md

      # 7.配置git机器人提交身份
      - name: Configure Git bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      # 8.提交全部新生成txt/m3u/readme，强制作者为机器人
      - name: Commit & push files
        run: |
          git add *.txt iptv.m3u README.md
          git commit --author="github-actions[bot] <github-actions[bot]@users.noreply.github.com>" -m "Update on ${{ env.DATE }}" --allow-empty
          git push origin main

      # 9.上传产物，Action页面下载全部输出文件
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: |
            *.txt
            iptv.m3u
