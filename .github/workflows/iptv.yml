name: Update

on:
  schedule:
    - cron: 0 20 * * *
  workflow_dispatch:

permissions:
  contents: write

env:
  TZ: Asia/Shanghai
  BRANCH: main

jobs:
  Update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get current Beijing time
        run: echo "DATE=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run iptv generate script
        run: python get_iptv.py

      - name: Show generated file info
        run: |
          ls -lh iptv.txt iptv.m3u
          echo "iptv.txt lines: $(wc -l < iptv.txt)"
          echo "iptv.m3u lines: $(wc -l < iptv.m3u)"

      - name: Skip commit if output empty
        run: |
          TXT_LINES=$(wc -l < iptv.txt)
          M3U_LINES=$(wc -l < iptv.m3u)
          if [ "$TXT_LINES" -eq 0 ] || [ "$M3U_LINES" -eq 0 ];then
            echo "生成的播放列表为空，终止工作流，不提交"
            exit 1
          fi

      # 改用echo分行输出，不再用<<EOF，消除YAML解析报错
      - name: Generate README.md
        run: |
          echo "## IPTV源自动更新" > README.md
          echo "更新时间：${{ env.DATE }}" >> README.md
          echo "" >> README.md
          echo "- iptv.txt：https://raw.githubusercontent.com/${{ github.repository }}/${{ env.BRANCH }}/iptv.txt" >> README.md
          echo "- iptv.m3u：https://raw.githubusercontent.com/${{ github.repository }}/${{ env.BRANCH }}/iptv.m3u" >> README.md

      - name: Configure Git bot identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit & push files
        run: |
          git add iptv.txt iptv.m3u README.md
          git commit -m "Update on ${{ env.DATE }}" --allow-empty
          git push origin ${{ env.BRANCH }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: iptv-output
          path: |
            iptv.txt
            iptv.m3u
